[project]
name = "open-pi-zero"
version = "0.1.1"
description = "Re-implementation of Pi0 vision-language-action (VLA) model from Physical Intelligence"
authors = [
  {name = "Allen Z. Ren", email = "allenzren1@gmail.com"},
]
readme = "README.md"
requires-python = "==3.10.*"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "einops",
    "hydra-core",
    "numpy==1.26.4",
    "omegaconf",
    "safetensors",
    "torch==2.5.0",
    "transformers==4.47.1",
    "batch-invariant-ops",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = []

[tool.uv.sources]
batch-invariant-ops = { path = "batch_invariant_ops" }

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["src/data/obs_transforms.py", "src/data/utils/data_utils.py"]

[tool.ruff.lint]
select = ["A", "B", "E", "F", "I", "RUF", "W"]
ignore = ["E203", "E501", "B006", "B026", "B905"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403"]
